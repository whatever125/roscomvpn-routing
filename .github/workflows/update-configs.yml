name: Update Routing Configs

on:
  workflow_dispatch:
  schedule:
    # Staggered after rucn-geoip (03:10 UTC) and rucn-geosite (04:17 UTC)
    # daily builds so this run picks up same-day fresh geo data.
    - cron: '0 5 * * *'
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - ".gitignore"
      - "LICENSE"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Regenerate deeplinks
        # Geoipurl/Geositeurl point at whatever125/rucn-geoip@release and
        # whatever125/rucn-geosite@release (live branch refs, actively
        # CDN-purged by those repos' own daily builds) rather than a dated
        # tag, so there's nothing to version-compare here -- just bump
        # LastUpdated and re-derive the deeplinks from the JSON every run.
        shell: bash
        run: |
          set -euo pipefail
          export TZ=UTC
          now_epoch="$(date -u +%s)"

          for platform in HAPP INCY; do
            scheme="$(echo "$platform" | tr '[:upper:]' '[:lower:]')"
            for variant in DEFAULT WHITELIST JSONSUB; do
              json="${platform}/${variant}.JSON"
              deeplink="${platform}/${variant}.DEEPLINK"

              tmp="$(mktemp)"
              jq --arg ts "$now_epoch" '.LastUpdated = $ts' "$json" > "$tmp"
              mv "$tmp" "$json"

              b64="$(jq -c . "$json" | base64 -w 0)"
              printf '%s://routing/onadd/%s\n' "$scheme" "$b64" > "$deeplink"
            done
          done

      - name: Update README with current links
        # Replaces only the block between the two ROUTING-LINKS markers,
        # leaving the rest of the README (install instructions, tables,
        # etc.) untouched.
        run: python3 .github/scripts/update_readme_links.py

      - name: Commit and push changes
        shell: bash
        run: |
          set -euo pipefail
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add HAPP INCY README.md

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "$(date -u +%Y%m%d%H%M)"
          git push
